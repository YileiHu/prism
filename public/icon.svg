<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Solid color blocks: cyan → violet, white front page -->
    <linearGradient id="blockCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0ea5b7"/>
    </linearGradient>
    <linearGradient id="blockViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pageWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9eefb"/>
    </linearGradient>

    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fanned stack of solid color blocks on a transparent background -->
  <g transform="translate(240 263) scale(1.58) translate(-256 -256)">
    <g transform="translate(6,-4)">
      <rect x="146" y="120" width="204" height="248" rx="30"
            fill="url(#blockCyan)" filter="url(#cardShadow)"
            transform="rotate(-8 262 288)"/>
      <rect x="170" y="140" width="204" height="248" rx="30"
            fill="url(#blockViolet)" filter="url(#cardShadow)"
            transform="rotate(-3 262 288)"/>
      <g transform="rotate(3 262 288)">
        <rect x="194" y="160" width="204" height="248" rx="30"
              fill="url(#pageWhite)" filter="url(#cardShadow)"/>

        <!-- Text lines + accent block on the white page -->
        <rect x="224" y="206" width="116" height="17" rx="8.5" fill="#0f172a" fill-opacity="0.78"/>
        <rect x="224" y="236" width="80" height="17" rx="8.5" fill="#0f172a" fill-opacity="0.45"/>
        <rect x="224" y="272" width="42" height="17" rx="8.5" fill="#f472b6"/>
      </g>
    </g>
  </g>
</svg>
